<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ethan&#39;s Math Game</title>
<meta name="apple-mobile-web-app-title" content="Ethan&#39;s Math">
<meta name="application-name" content="Ethan&#39;s Math">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: sky and grass backdrop, star progress on top, one chunky play card, mode chips below */
:root{
  --sky:#8fd3ff; --sky2:#d4f0ff; --grass:#74c95a; --grass2:#5bb043;
  --card:#fffdf6; --ink:#2b3a55; --soft:#e9eef7;
  --ga:#ff8a3d; --gb:#29a8ff; --gc:#a55cff; --good:#22a852; --bad:#ec4545; --sun:#ffc93c;
  --display:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 62%,var(--grass) 62%,var(--grass2) 100%);
  background-attachment:fixed; color:var(--ink); font-family:var(--display);
  -webkit-tap-highlight-color:transparent; user-select:none;
}
.app{
  min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:14px;
  padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.top{width:100%;max-width:640px;display:flex;align-items:center;gap:10px}
.stars{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.star{font-size:clamp(20px,5vw,30px);filter:grayscale(1);opacity:.35;transition:transform .3s}
.star.on{filter:none;opacity:1;animation:pop .5s}
.iconbtn{
  border:0;background:var(--card);border-radius:50%;width:48px;height:48px;font-size:24px;cursor:pointer;
  box-shadow:0 4px 0 rgba(43,58,85,.25);
}
.card{
  width:100%;max-width:640px;box-sizing:border-box;background:var(--card);border-radius:28px;
  padding:22px 14px 24px;box-shadow:0 8px 0 rgba(43,58,85,.18),0 18px 40px rgba(43,58,85,.15);
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.eq{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,2vw,16px);flex-wrap:wrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.objs{
  display:grid;grid-template-columns:repeat(var(--cols),1.25em);justify-content:center;
  font-size:clamp(20px,5.4vw,34px);line-height:1.25;padding:4px 6px 6px;border-radius:14px;
  min-height:1.3em;
}
.grp.a .objs{background:#fff1e6;box-shadow:inset 0 -5px 0 var(--ga)}
.grp.b .objs{background:#e6f5ff;box-shadow:inset 0 -5px 0 var(--gb)}
.grp.c .objs{background:#f3e9ff;box-shadow:inset 0 -5px 0 var(--gc)}
.ci.gc .e{border-color:var(--gc)}
.o{text-align:center;animation:pop .35s both}
.num{font-weight:800;font-size:clamp(36px,9vw,58px);line-height:1}
.op{font-weight:800;font-size:clamp(34px,8vw,54px);line-height:1;padding-bottom:2px;color:#8a5cff}
.slot .objs{background:var(--soft);border:3px dashed #b9c4d8;min-width:2.5em;min-height:2.5em;align-content:center}
.slot .qm{grid-column:1/-1;text-align:center;font-weight:800;color:#9aa6bd}
.slot .num{color:#9aa6bd}
.slot.filled .objs{border-color:var(--good);background:#e5f8eb}
.slot.filled .num{color:var(--good);animation:pop .5s}

.choices{display:flex;gap:clamp(10px,3vw,20px);justify-content:center;flex-wrap:wrap}
.ch{
  border:0;cursor:pointer;border-radius:24px;width:clamp(92px,26vw,130px);padding:10px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-family:var(--display);
  box-shadow:0 7px 0 rgba(43,58,85,.28);transition:transform .1s;
}
.ch:nth-child(1){background:#ffe066}.ch:nth-child(2){background:#ffb3c7}.ch:nth-child(3){background:#9ee6b8}
.ch:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(43,58,85,.28)}
.ch:focus-visible,.iconbtn:focus-visible,.mode:focus-visible,.big:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.ch .d{font-weight:800;font-size:clamp(44px,11vw,64px);line-height:1}
.dots{display:grid;grid-template-columns:repeat(5,10px);gap:4px;min-height:24px;align-content:start}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:.75}
.ch.wrong{background:var(--bad)!important;color:#fff;animation:shake .45s}
.ch.wrong .dots i{background:#fff}
.ch.out{opacity:.35;filter:grayscale(.6);cursor:default;box-shadow:none;transform:scale(.92)}
.ch.right{background:var(--good)!important;color:#fff;animation:pop .4s}
.ch.right .dots i{background:#fff}

.explain{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.badge{display:flex;align-items:center;gap:10px;border-radius:20px;padding:6px 16px;font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.1}
.badge.bad{background:#fde3e3;color:var(--bad)}
.badge.good{background:#e1f6e8;color:var(--good);animation:pop .5s}
.badge .dots i{background:currentColor}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;max-width:100%}
.ci{position:relative;display:flex;flex-direction:column;align-items:center;width:1.6em;font-size:clamp(28px,7.5vw,42px);animation:pop .35s both}
.ci .e{line-height:1.2;transition:opacity .3s,transform .3s,filter .3s;border-bottom:5px solid transparent;padding-bottom:2px}
.ci.ga .e{border-color:var(--ga)} .ci.gb .e{border-color:var(--gb)}
.ci .n{font-weight:800;font-size:.62em;height:1.3em;line-height:1.3;color:var(--good)}
.ci.counted .e{animation:hop .4s}
.ci.gone .e{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.ci.gone::after{content:"✖";position:absolute;top:0;left:50%;transform:translateX(-50%);color:var(--bad);font-size:1em;font-weight:800;animation:pop .3s both}
.big{
  border:0;cursor:pointer;background:var(--good);color:#fff;border-radius:50%;width:88px;height:88px;
  font-size:44px;box-shadow:0 7px 0 #167a3a;animation:pulse 1.2s infinite;font-family:var(--display);
}
.modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ci{font-size:clamp(24px,6.5vw,38px)}
.objs{font-size:clamp(17px,4.6vw,30px)}
.mode{
  border:0;cursor:pointer;min-width:64px;height:56px;border-radius:18px;font-family:var(--display);
  font-weight:800;font-size:30px;background:rgba(255,255,255,.7);color:var(--ink);box-shadow:0 4px 0 rgba(43,58,85,.2);
}
.mode.on{background:#8a5cff;color:#fff;box-shadow:0 4px 0 #5a35c9}
.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:rgba(143,211,255,.94);z-index:20;text-align:center;padding:20px;
}
.overlay .hero{font-size:clamp(70px,22vw,130px);animation:hop 1.4s infinite}
.overlay .row{font-size:clamp(24px,6vw,36px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top .iconbtn{flex:none;color:var(--ink);font-family:var(--display);font-weight:800}
/* base ten blocks for 2 digit problems */
.blk{--u:clamp(7px,2vw,10px);display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:5px;padding:6px 8px 9px;border-radius:14px;max-width:11em;min-height:calc(var(--u)*11)}
.grp.a .blk{background:#fff1e6;box-shadow:inset 0 -5px 0 var(--ga);color:var(--ga)}
.grp.b .blk{background:#e6f5ff;box-shadow:inset 0 -5px 0 var(--gb);color:var(--gb)}
.grp.c .blk{background:#f3e9ff;box-shadow:inset 0 -5px 0 var(--gc);color:var(--gc)}
.slot.filled .blk{background:#e5f8eb;color:var(--good);border:3px dashed var(--good)}
.bar{display:grid;grid-template-rows:repeat(10,var(--u));width:var(--u);gap:1px}
.bar i,.cube{display:block;background:currentColor;border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(3,var(--u));gap:2px;align-content:end}
.cube{width:var(--u);height:var(--u)}
.count{--u:clamp(9px,2.6vw,13px)}
.ci .e{color:#7b879e}
.ci.ga .e{color:var(--ga)} .ci.gb .e{color:var(--gb)} .ci.gc .e{color:var(--gc)}
.ci.one .e .cube{width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);margin-top:.3em}
.ci.one{width:1.15em}
.ci.ten{width:1.5em}
.ci .e .bar{margin:0 auto}
.help{
  border:0;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;
  background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px;
  box-shadow:0 5px 0 #c99410;
}
.help span{font-size:30px;line-height:1}
.help:active{transform:translateY(3px);box-shadow:0 2px 0 #c99410}
.help:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.badge.hint{background:#fff6d6;color:#9a6b00}

.controls{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.type{
  border:0;cursor:pointer;display:flex;align-items:center;gap:8px;height:56px;padding:0 18px;border-radius:18px;
  font-family:var(--display);font-weight:800;font-size:20px;background:rgba(255,255,255,.75);color:var(--ink);
  box-shadow:0 4px 0 rgba(43,58,85,.2);
}
.type b{font-size:32px;line-height:1}
.type.on[data-t="add"]{background:var(--ga);color:#fff;box-shadow:0 4px 0 #c45a17}
.type.on[data-t="sub"]{background:var(--gb);color:#fff;box-shadow:0 4px 0 #157bbd}
.type.on[data-t="mix"]{background:#8a5cff;color:#fff;box-shadow:0 4px 0 #5a35c9}
.opt{
  border:0;cursor:pointer;height:44px;padding:0 16px;border-radius:14px;font-family:var(--display);font-weight:800;font-size:18px;
  background:rgba(255,255,255,.6);color:var(--ink);box-shadow:0 3px 0 rgba(43,58,85,.2);
}
.opt.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #111b2e}
.type:focus-visible,.opt:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.overlay .pair{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.big.no{background:var(--bad);box-shadow:0 7px 0 #a82b2b;animation:none}
.big.t{width:104px;height:104px;font-size:56px;animation:none;font-weight:800}
.big.t.add{background:var(--ga);box-shadow:0 7px 0 #c45a17}
.big.t.sub{background:var(--gb);box-shadow:0 7px 0 #157bbd}
.big.t.mix{background:#8a5cff;box-shadow:0 7px 0 #5a35c9;font-size:40px}
.big.t.num2[aria-pressed="true"],.big.t.num3[aria-pressed="true"]{background:var(--good);color:#fff;box-shadow:0 7px 0 #167a3a}
.big.t.num2[aria-pressed="true"]::after,.big.t.num3[aria-pressed="true"]::after{content:"✔";position:absolute;top:8px;right:12px;font-size:22px}
#setup .pair{align-items:center}
.big.t.num2,.big.t.num3{position:relative;width:132px;height:132px;border-radius:32px;background:var(--card);color:var(--ink);box-shadow:0 7px 0 rgba(43,58,85,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big.t small{font-size:17px;line-height:1.1}
.lv i{font-style:normal}
.gear{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);border:0;cursor:pointer;display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.55);color:#53627d;font-family:var(--display);font-weight:800;font-size:15px}
.gear span{font-size:18px}
.gear i{font-style:normal;font-weight:600}
.lvtag{font-size:12px;font-weight:600;color:rgba(43,58,85,.45);letter-spacing:.04em;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;margin-top:-4px}
.gear:focus-visible,.done:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.gate-card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 20px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 8px 0 rgba(43,58,85,.18)}
.gate-card h2{margin:0;font-size:24px}
.gate-card p{margin:0;font-size:18px;font-family:system-ui,sans-serif;font-weight:600}
.gate-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.gate-opts button{border:0;cursor:pointer;height:52px;border-radius:14px;background:var(--soft);color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px}
.gate-opts button.no{background:#fde3e3;animation:shake .4s}
.lv.cancel{height:46px;font-size:17px;background:var(--soft);box-shadow:none}
.ptitle{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(28px,7vw,38px);color:var(--ink);background:#fff;padding:6px 22px;border-radius:999px;box-shadow:0 5px 0 rgba(43,58,85,.2)}
.levels{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.lvl{border:0;cursor:pointer;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:18px;background:var(--card);color:var(--ink);font-family:var(--display);text-align:left;box-shadow:0 4px 0 rgba(43,58,85,.25)}
.lvl b{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:24px}
.lvl span{flex:1;font-weight:800;font-size:20px}
.lvl em{font-style:normal;font-weight:600;font-size:16px;color:#6b7891;font-variant-numeric:tabular-nums}
.lvl[aria-pressed="true"]{background:var(--good);color:#fff;box-shadow:0 4px 0 #167a3a}
.lvl[aria-pressed="true"] b{background:#fff;color:var(--good)}
.lvl[aria-pressed="true"] em{color:#e6fff0}
.lvl:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.ready .rsign{font-weight:800;font-size:clamp(70px,20vw,120px);line-height:1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:pop .5s both}
.ready .rsign.add{color:var(--ga)}.ready .rsign.sub{color:var(--gb)}.ready .rsign.mix{color:#8a5cff}
#readyBuddy .bot{--bs:110px}
.demo{display:flex;align-items:center;gap:8px;font-size:clamp(30px,8vw,46px);font-weight:800;color:var(--ink);background:#fff;border-radius:22px;padding:8px 18px;box-shadow:0 5px 0 rgba(43,58,85,.18);min-height:1.4em;flex-wrap:wrap;justify-content:center}
.demo:empty{visibility:hidden}
.demo>*{animation:pop .35s both}
.countdown{font-weight:800;font-size:clamp(90px,26vw,150px);line-height:1;color:var(--good);-webkit-text-stroke:4px #fff;paint-order:stroke fill;text-shadow:0 6px 0 rgba(43,58,85,.2)}
.countdown.tick{animation:pop .45s both}
.skip{border:0;cursor:pointer;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.7);color:var(--ink);font-size:26px;box-shadow:0 4px 0 rgba(43,58,85,.2)}
.skip:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.done{border:0;cursor:pointer;height:60px;padding:0 34px;border-radius:999px;background:var(--good);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 6px 0 #167a3a}
.overlay .back{width:56px;height:56px;font-size:24px;color:var(--ink)}
#setup{gap:14px;overflow-y:auto}
.step{display:flex;flex-direction:column;align-items:center;gap:8px}
.step h2{margin:0;font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.02em}
.lv{
  border:0;cursor:pointer;position:relative;display:flex;align-items:center;gap:8px;height:60px;padding:0 22px 0 18px;border-radius:20px;
  font-family:var(--display);font-weight:800;font-size:19px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(43,58,85,.3);
}
.lv b{font-size:28px;line-height:1}
.lv[aria-pressed="true"]{background:var(--good);color:#fff;box-shadow:0 5px 0 #167a3a}
.lv[aria-pressed="true"]::after{content:"✔";margin-left:4px}
.lv:focus-visible,.big:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.summary{background:var(--card);color:var(--ink);border-radius:16px;padding:8px 18px;font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(43,58,85,.2)}
.summary span{color:var(--good)}
.ci.gone.gb .e{border-color:var(--gb)} .ci.gone.gc .e{border-color:var(--gc)}
/* intro: a sunny hill with Ethan's name bouncing in */
.intro{background:linear-gradient(180deg,#6cc6ff 0%,#bfe8ff 58%,var(--grass) 58%,var(--grass2) 100%);overflow:hidden}
.intro-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.intro-body.waiting{visibility:hidden}
.big.go.later{animation:pop .5s both,pulse 1.2s .5s infinite}
.tapme{position:absolute;inset:0;z-index:3;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:var(--display);color:var(--ink);padding:20px}
.tapme>span{display:flex}
.tapme .welcome{font-weight:800;font-size:clamp(38px,10vw,64px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 rgba(43,58,85,.25);animation:sway 2.4s ease-in-out infinite}
.tapme .sleepy{position:relative;align-items:flex-end}
.tapme .sleepy .bot{--bs:clamp(130px,34vw,180px)}
.tapme .bubble.wake{font-size:clamp(18px,4.8vw,24px);max-width:16em;text-align:center}
.tapme .bubble.wake::before{left:50%;top:-14px;margin:0 0 0 -10px;border:10px solid transparent;border-bottom:14px solid #fff;border-top:0}
.tapme .tapword{align-items:center;gap:8px;font-weight:800;font-size:clamp(28px,7.5vw,42px);color:#fff;background:var(--good);padding:8px 30px;border-radius:999px;box-shadow:0 6px 0 #167a3a;animation:pulse 1.2s infinite}
.tapme .hand{font-size:1.3em;line-height:1;display:inline-block;animation:tap 1s ease-in-out infinite}
.zzz{position:absolute;right:-34px;top:0;width:60px;height:100px;pointer-events:none}
.zzz i{position:absolute;left:0;bottom:30px;font-style:normal;font-weight:800;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;opacity:0;animation:zz 3s infinite}
.zzz i:nth-child(1){font-size:30px}.zzz i:nth-child(2){font-size:24px;animation-delay:1s}.zzz i:nth-child(3){font-size:18px;animation-delay:2s}
.bot.sleep .eye{animation:none;transform:scaleY(.12)}
.bot.sleep .light{animation:none;fill:#b7c1d3}
.bot.sleep .idle{animation:breathe 2.6s ease-in-out infinite}
.bot.sleep .whole{transform:rotate(-6deg)}
.bot.waking .whole{animation:hop .4s 2}
.floaters{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-80px;font-weight:800;color:var(--c);-webkit-text-stroke:2px #fff;paint-order:stroke fill;animation:floatUp var(--d) linear infinite;animation-delay:var(--dl);opacity:.9}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(26px,-70px);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,.98)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--x),-55vh) rotate(var(--r))}100%{transform:translate(0,-115vh) rotate(0)}}
.tapme:focus-visible{outline:4px solid var(--ink);outline-offset:-8px}
/* egg and buddy picker */
.bigegg{display:block;line-height:0}
.bigegg svg{width:clamp(150px,40vw,210px);height:auto;overflow:visible}
.bigegg.small svg{width:96px}
.bigegg .egg{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 1.6s ease-in-out infinite}
.bigegg .egg-top{transform-box:fill-box;transform-origin:20% 100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .5s}
.bigegg.cracked .egg{animation:none}
.bigegg.cracked .egg-top{transform:translate(-26px,-46px) rotate(-38deg);opacity:0}
.hatch{gap:16px;overflow-y:auto}
.hatch-top{display:flex;align-items:center;gap:14px}
.hatch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(560px,100%);opacity:0;pointer-events:none}
.hatch-grid.show{opacity:1;pointer-events:auto}
.hatch-grid.show .cr{animation:pop .45s both}
.cr{border:0;cursor:pointer;background:var(--card);border-radius:24px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(43,58,85,.22);font-family:var(--display)}
.cr .bot{--bs:clamp(70px,20vw,104px)}
.cr:hover .bot .whole,.cr:focus-visible .bot .whole{animation:hop .45s 2}
.cr:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.crname{font-weight:800;font-size:clamp(16px,4vw,20px);color:var(--ink)}
.eggpick{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);border:0;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);font-family:var(--display);font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(43,58,85,.2)}
.eggpick span{font-size:22px;display:inline-block;animation:wobble 1.6s ease-in-out infinite}
.eggpick:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
/* Ethan's creature buddy */
.bot{--bs:120px;flex:none;display:inline-block;line-height:0}
.bot svg{width:var(--bs);height:auto;overflow:visible;display:block}
.bot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bot .mouth{transform-box:fill-box;transform-origin:center;transition:transform .1s}
.bot.talk .mouth{animation:talk .18s infinite alternate}
.bot .arm-r{transform-box:fill-box;transform-origin:50% 8%}
.bot .arm-l{transform-box:fill-box;transform-origin:50% 8%}
.bot.wave .arm-r{animation:wave .45s 6 alternate ease-in-out}
.bot .light{animation:glow 1.1s infinite alternate}
.bot .whole{transform-box:fill-box;transform-origin:50% 100%}
.bot.happy .whole{animation:hop .45s 3}
.bot.happy .arm-l,.bot.happy .arm-r{animation:cheerArm .45s 3 alternate}
.bot.think .whole{transform:rotate(-7deg);transition:transform .3s}
.bot .idle{animation:float 3s ease-in-out infinite}
.buddy{display:flex;align-items:center;gap:12px;max-width:100%}
.bubble{position:relative;background:#fff;color:var(--ink);border-radius:22px;padding:10px 18px;font-weight:800;font-size:clamp(18px,4.6vw,26px);line-height:1.25;
  box-shadow:0 5px 0 rgba(43,58,85,.18);max-width:18em;min-width:0;text-wrap:balance}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.bubble.pop{animation:pop .35s both}
#introBuddy.pending{visibility:hidden}
#introBuddy.show .bot{animation:rise .6s cubic-bezier(.3,1.5,.5,1) both}
.buddy.mini{width:100%;max-width:640px}
.buddy.mini .bot{--bs:58px}
.buddy.mini .bubble{font-size:clamp(16px,4.2vw,21px);padding:8px 14px}
#start .buddy .bot{--bs:110px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scale(1.1,3.2)}}
@keyframes wave{from{transform:rotate(-30deg)}to{transform:rotate(-155deg)}}
@keyframes cheerArm{from{transform:rotate(0)}to{transform:rotate(var(--up,-150deg))}}
@keyframes glow{from{fill:#ffd23f}to{fill:#ff5fa2}}
@keyframes rise{0%{transform:translateY(60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bot .arm-l{--up:150deg}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(18px) scale(.92)}}
.sun{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(22px,env(safe-area-inset-right,0px));width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,#fff3a8 0 40%,var(--sun) 41% 100%);box-shadow:0 0 0 14px rgba(255,201,60,.25),0 0 0 30px rgba(255,201,60,.12);animation:spin 18s linear infinite}
.cloud{position:absolute;height:38px;border-radius:40px;background:#fff;opacity:.95;animation:drift 26s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52px;height:52px;top:-26px;left:20px}
.cloud::after{width:38px;height:38px;top:-18px;left:58px}
.c1{width:130px;top:12%;left:-160px}
.c2{width:100px;top:24%;left:-160px;animation-duration:34s;animation-delay:-14s;transform:scale(.8)}
.c3{width:150px;top:6%;left:-160px;animation-duration:40s;animation-delay:-26s}
.hill{position:absolute;left:-10%;right:-10%;bottom:-8vh;height:44vh;border-radius:50% 50% 0 0;background:var(--grass2);z-index:1}
.name{display:flex;gap:2px;font-weight:800;font-size:clamp(56px,16vw,108px);line-height:1}
.name span{display:inline-block;color:var(--c);-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 6px 0 rgba(43,58,85,.25);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.subtitle{background:#fff;color:var(--ink);font-weight:800;font-size:clamp(22px,6vw,32px);padding:4px 22px;border-radius:999px;box-shadow:0 5px 0 rgba(43,58,85,.2);animation:pop .5s .9s both}
.parade{display:flex;gap:6px;align-items:center;font-size:clamp(34px,9vw,52px);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(43,58,85,.3)}
.parade span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.parade span:nth-child(2n){animation-delay:.2s}.parade span:nth-child(3n){animation-delay:.4s}
.big.go{width:110px;height:110px;font-size:56px;margin-top:8px}
.pick-title{font-weight:800;font-size:clamp(28px,7vw,42px);color:var(--ink);background:#fff;padding:6px 24px;border-radius:999px;box-shadow:0 5px 0 rgba(43,58,85,.2)}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px}
.pick span{font-weight:800;font-size:18px;color:var(--ink)}
@keyframes drop{0%{transform:translateY(-120px) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes drift{to{transform:translateX(calc(100vw + 340px))}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <button class="iconbtn" id="home" aria-label="Exit to home screen">🏠</button>
    <div class="stars" id="stars" aria-label="Stars earned"></div>
    <button class="iconbtn eggbtn" aria-label="Get a new buddy">🥚</button>
    <button class="iconbtn" id="restart" aria-label="Start over">↻</button>
    <button class="iconbtn" id="snd" aria-label="Sound on or off">🔊</button>
  </div>
  <div class="buddy mini" id="gameBuddy"><div class="bot" id="gameBot" data-bot></div><div class="bubble" id="gameBubble" aria-live="polite">Let's do math, Ethan!</div></div>
  <section class="card">
    <div class="eq" id="problem"></div>
    <div class="choices" id="choices"></div>
    <button class="help" id="helpB"><span>🙋</span>Help me</button>
    <div class="explain" id="explain" hidden></div>
  </section>
  <div class="lvtag" id="lvTag" aria-label="Difficulty level set by a parent"></div>
</div>

<div class="overlay intro" id="intro">
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="cloud c3" aria-hidden="true"></div>
  <div class="hill" aria-hidden="true"></div>
  <div class="intro-body">
    <div class="name" aria-label="Ethan's"></div>
    <div class="subtitle">Math Adventure</div>
    <div class="buddy pending" id="introBuddy"><div class="bot" id="introBot" data-bot></div><div class="bubble" id="introBubble" aria-live="polite">Hi Ethan!</div></div>
    <button class="big go" id="letsgo" aria-label="Let's go">▶</button>
  </div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <button class="tapme" id="tapme" aria-label="Tap to enter" hidden>
    <span class="welcome">Welcome, Ethan!</span>
    <span class="sleepy"><span class="bigegg" id="tapEgg"></span></span>
    <span class="bubble wake">Your egg is wiggling! Tap it to see who hatches!</span>
    <span class="tapword"><span class="hand">👆</span>Tap to hatch</span>
  </button>
</div>
<div class="overlay" id="start" hidden>
  <div class="buddy" id="pickBuddy"><div class="bot" id="pickBot" data-bot></div><div class="bubble" id="pickBubble">Pick a game, Ethan!</div></div>
  <div class="pair">
    <div class="pick"><button class="big t add" data-start="add" aria-label="Play adding">+</button><span>Adding</span></div>
    <div class="pick"><button class="big t sub" data-start="sub" aria-label="Play taking away">−</button><span>Taking away</span></div>
    <div class="pick"><button class="big t mix" data-start="mix" aria-label="Play a mix">±</button><span>Mix</span></div>
  </div>
  <button class="eggbtn eggpick" aria-label="Get a new buddy"><span>🥚</span>New buddy</button>
  <button class="gear" id="gear" aria-label="Parent settings"><span>⚙️</span>Parents · <i id="gearLv">Level 1</i></button>
</div>
<div class="overlay hatch" id="hatch" hidden>
  <div class="hatch-top"><span class="bigegg small" id="hatchEgg"></span><div class="bubble" id="hatchBubble">Pick your buddy, Ethan!</div></div>
  <div class="hatch-grid" id="hatchGrid"></div>
</div>
<div class="overlay ready" id="ready" hidden>
  <div class="rsign" id="rsign">+</div>
  <div class="buddy" id="readyBuddy"><div class="bot" id="readyBot" data-bot></div><div class="bubble" id="readyBubble">Yay!</div></div>
  <div class="demo" id="demo" aria-hidden="true"></div>
  <div class="countdown" id="countdown" hidden></div>
  <button class="skip" id="skipReady" aria-label="Start now">▶</button>
</div>
<div class="overlay" id="gate" hidden>
  <div class="gate-card">
    <h2>Grown ups only</h2>
    <p id="gateQ">To open settings, tap the answer to 6 × 4</p>
    <div class="gate-opts" id="gateOpts"></div>
    <button class="lv cancel" id="gateNo">Cancel</button>
  </div>
</div>
<div class="overlay" id="setup" hidden>
  <div class="ptitle"><span>⚙️</span>Parent settings</div>
  <div class="step">
    <h2>Pick Ethan's level</h2>
    <div class="levels">
      <button class="lvl" data-level="1" aria-pressed="true"><b>1</b><span>Easy</span><em>3 + 4</em></button>
      <button class="lvl" data-level="2" aria-pressed="false"><b>2</b><span>A little harder</span><em>3 + 4 + 2</em></button>
      <button class="lvl" data-level="3" aria-pressed="false"><b>3</b><span>Big numbers</span><em>23 + 14</em></button>
      <button class="lvl" data-level="4" aria-pressed="false"><b>4</b><span>Big challenge</span><em>14 + 21 + 3</em></button>
    </div>
  </div>
  <button class="done" id="done">✔ Done</button>
</div>
<div class="overlay" id="confirm" hidden>
  <div class="hero">↻</div>
  <div class="row">⭐ → 0</div>
  <div class="pair">
    <button class="big" id="yes" aria-label="Yes, start over">✔</button>
    <button class="big no" id="no" aria-label="No, keep playing">✖</button>
  </div>
</div>
<div class="overlay" id="win" hidden>
  <div class="hero">🏆</div>
  <div class="pick-title">Great job, Ethan!</div>
  <div class="row">⭐⭐⭐⭐⭐<br>⭐⭐⭐⭐⭐</div>
  <button class="big" id="again" aria-label="Play again">↻</button>
</div>
<canvas id="fx"></canvas>

<script>
const EMO=["🍎","🐶","⭐","🐟","🍪","🦆","🚗","🐸","🍓","🎈","🐞","🍌","🐱","🧁"];
const GOAL=10;
let type="mix",howMany=2,digits=1,score=0,cur=null,busy=false,soundOn=true,lastKey="",run=0,helped=false,tries=0;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const shuffle=arr=>arr.sort(()=>Math.random()-.5);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let actx=null;
function tone(f,d=.15,kind="sine",vol=.2,when=0){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
    o.type=kind;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function cheer(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",.2,i*.09))}
function boop(){tone(220,.22,"square",.08);tone(165,.3,"square",.08,.15)}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
let talkTimer=0;
/* pick the most natural, friendly voice this device has.
   Best first: kid and neural voices (Edge, Chrome), then Apple's premium and enhanced voices */
const VOICE_PREFS=[
  /ana.*natural/i,/ana online/i,
  /(jenny|aria|ava|emma|michelle|sonia|libby|natasha).*natural/i,
  /zoe.*premium/i,/ava.*premium/i,/evan.*premium/i,/samantha.*premium/i,
  /zoe.*enhanced/i,/ava.*enhanced/i,/evan.*enhanced/i,/samantha.*enhanced/i,/allison.*enhanced/i,/susan.*enhanced/i,
  /premium/i,/enhanced/i,/natural/i,/neural/i,
  /google us english/i,/google uk english female/i,
  /^samantha/i,/^karen/i,/^moira/i,/^tessa/i,/^allison/i
];
let bestVoice=null,kidVoice=false;
function chooseVoice(){
  try{
    const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!all.length)return;
    const us=all.filter(v=>/en[-_]us/i.test(v.lang));
    for(const re of VOICE_PREFS){const v=us.find(x=>re.test(x.name))||all.find(x=>re.test(x.name));if(v){bestVoice=v;break}}
    if(!bestVoice)bestVoice=us[0]||all[0];
    kidVoice=/ana/i.test(bestVoice.name);
  }catch(e){}
}
try{chooseVoice();speechSynthesis.addEventListener("voiceschanged",chooseVoice)}catch(e){}
/* small touches that make speech sound more human: commas for breathing room */
function humanize(t){return t.replace(/!(?=\s|$)/g,"!").replace(/\bEthan\b/g,"Ethan,").replace(/,,/g,",").replace(/,([!?.])/g,"$1")}
function talking(on){document.querySelectorAll(".bot").forEach(b=>b.classList.toggle("talk",on))}
function speakTime(txt){return 500+txt.length*62}
/* keep a reference to the current line; Safari can drop lines (and never report the end)
   when the utterance object is cleaned up too early */
let curUtter=null,speechGen=0;
function say(txt,bubbleId="gameBubble"){
  const b=$(bubbleId);if(b){b.textContent=txt;b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}
  clearTimeout(talkTimer);talking(true);talkTimer=setTimeout(()=>talking(false),speakTime(txt));
  const gen=++speechGen;
  return new Promise(res=>{
    if(!soundOn)return res();
    try{
      const s=window.speechSynthesis;if(!s)return res();
      const u=new SpeechSynthesisUtterance(humanize(txt));
      if(bestVoice){u.voice=bestVoice;u.lang=bestVoice.lang}
      /* gentle, warm settings; a very high pitch is what sounds robotic */
      u.rate=/^\d+$/.test(txt)?0.9:0.95;u.pitch=kidVoice?1.0:((BUDDIES[buddy]||{}).pitch||1.12);u.volume=1;
      let done=false;const fin=()=>{if(done)return;done=true;if(gen===speechGen){clearTimeout(talkTimer);talking(false)}res()};
      u.onend=fin;u.onerror=fin;
      curUtter=u;
      /* iPad drops a line that is spoken right after cancel(), so give it a moment */
      if(s.speaking||s.pending){s.cancel();setTimeout(()=>{if(gen===speechGen)s.speak(u);else fin()},120)}
      else s.speak(u);
      /* safety net in case a browser never reports the end */
      setTimeout(fin,speakTime(txt)*1.8+2500);
    }catch(e){res()}
  });
}
/* say a line and wait until the buddy finishes it, plus a short natural pause */
async function sayWait(txt,bubbleId){
  const t0=Date.now();
  await say(txt,bubbleId);
  const min=soundOn?600:speakTime(txt);
  const spent=Date.now()-t0;if(spent<min)await sleep(min-spent);
  await sleep(350);
}
/* Safari only allows speech that begins inside a tap, so speak a silent word during the tap */
function primeSpeech(){
  try{const s=window.speechSynthesis;if(!s)return;const u=new SpeechSynthesisUtterance(" ");u.volume=0;curUtter=u;s.speak(u)}catch(e){}
}
function mood(m){const b=$("gameBot");if(!b)return;b.classList.remove("happy","think");void b.offsetWidth;if(m)b.classList.add(m)}
const word=op=>op==="+"?"plus":"minus";

function dots(n){if(cur&&cur.big)return"";let h='<span class="dots">';for(let i=0;i<n;i++)h+="<i></i>";return h+"</span>"}
function objs(n,e){let h=`<div class="objs" style="--cols:${Math.max(1,Math.min(n,5))}">`;for(let i=0;i<n;i++)h+=`<span class="o" style="animation-delay:${i*40}ms">${e}</span>`;return h+"</div>"}
const barHTML=()=>'<span class="bar">'+"<i></i>".repeat(10)+"</span>";
function blocks(n){
  let h='<div class="blk">';
  for(let i=0;i<Math.floor(n/10);i++)h+=barHTML();
  if(n%10)h+='<span class="ones">'+'<span class="cube"></span>'.repeat(n%10)+"</span>";
  return h+"</div>";
}
const pic=n=>cur.big?blocks(n):objs(n,cur.emo);

function renderStars(){
  let h="";for(let i=0;i<GOAL;i++)h+=`<span class="star${i<score?" on":""}">⭐</span>`;
  $("stars").innerHTML=h;
}
function gen(kind,n,big){
  if(kind==="add"){
    if(n===2){
      if(big){const a=rand(10,60);return shuffle([a,rand(1,Math.min(39,99-a))])}
      const a=rand(2,9);return [a,rand(1,9)];
    }
    if(big){let x;do{x=shuffle([rand(10,25),rand(1,20),rand(1,12)])}while(x[0]+x[1]+x[2]>60);return x}
    return [rand(1,9),rand(1,9),rand(1,9)];
  }
  /* taking away: 2 digit problems never need borrowing */
  if(n===2){
    if(big){const a=rand(20,99);let b;do{b=rand(0,Math.floor(a/10))*10+rand(0,a%10)}while(b<1||b>=a);return [a,b]}
    const a=rand(5,18);return [a,rand(1,Math.min(a,9))];
  }
  if(big){
    let a,b,c;
    do{
      a=rand(40,99);const at=Math.floor(a/10),ao=a%10;
      const bt=rand(0,at),ct=rand(0,at-bt),bo=rand(0,ao),co=rand(0,ao-bo);
      b=bt*10+bo;c=ct*10+co;
    }while(b<1||c<1||(b<10&&c<10));
    return [a,b,c];
  }
  const a=rand(6,18),b=rand(1,Math.min(9,a-1));return [a,b,rand(1,Math.min(9,a-b))];
}
function make(){
  let p,key;
  do{
    const big=digits===2;
    const kind=type==="mix"?pick(["add","sub"]):type;
    const nums=gen(kind,pick(counts),big),op=kind==="sub"?"-":"+";
    const ans=op==="+"?nums.reduce((s,n)=>s+n,0):nums.slice(1).reduce((s,n)=>s-n,nums[0]);
    p={nums,op,ans,big,emo:pick(EMO)};key=nums.join(op);
  }while(key===lastKey);
  lastKey=key;return p;
}
function options(ans,big){
  const c=(big?[ans+10,ans-10,ans+1,ans-1,ans+2,ans-2]:[ans-1,ans+1,ans-2,ans+2,ans+3,ans-3]).filter(v=>v>=0&&v<=(big?99:30));
  const out=[ans];
  for(const v of shuffle(c)){if(out.length<3&&!out.includes(v))out.push(v)}
  return shuffle(out);
}
function renderProblem(){
  const {nums,op}=cur,cls=["a","b","c"];
  $("problem").innerHTML=nums.map((n,i)=>(i?`<div class="op">${op==="+"?"+":"−"}</div>`:"")+
    `<div class="grp ${cls[i]}">${pic(n)}<div class="num">${n}</div></div>`).join("")+`
    <div class="op">=</div>
    <div class="grp slot" id="slot"><div class="objs" style="--cols:1"><span class="qm">?</span></div><div class="num">?</div></div>`;
}
function fillSlot(){
  const s=$("slot");s.classList.add("filled");
  s.innerHTML=(cur.ans?pic(cur.ans):'<div class="objs" style="--cols:1"><span class="qm">0</span></div>')+`<div class="num">${cur.ans}</div>`;
}
function showChoices(){
  const ch=$("choices");ch.hidden=false;
  ch.innerHTML=options(cur.ans,cur.big).map(v=>`<button class="ch" data-v="${v}" aria-label="${v}"><span class="d">${v}</span>${dots(v)}</button>`).join("");
}
function newProblem(){

async function walk(picked){
  const my=run,alive=()=>my===run;
  const lead=picked===null?"I'll help you, Ethan! ":pick(["Good try, Ethan! ","Almost! ","That's okay, buddy! "]);
  const {nums,op,ans,emo,big}=cur,a=nums[0],b=nums[1],G=["ga","gb","gc"];

    :`<div class="badge bad"><span>${picked}</span>${dots(picked)}<span>✖</span></div>`;
  ex.innerHTML=`${top}<div class="count" id="cnt"></div>
    <div class="badge good" id="goodB" hidden><span>${ans}</span>${dots(ans)}<span>✔</span></div>
    <button class="big" id="nextB" hidden aria-label="Next">▶</button>`;
  const cnt=$("cnt");
  const step=async(it,label,f,ms)=>{it.querySelector(".n").textContent=label;it.classList.add("counted");tone(f,.12,"sine",.18);say(String(label));await sleep(ms)};
  if(big){
    say(lead+(op==="+"?"Count the tens, then the ones!":"Take some away, then count what is left!"));
    const tens=[],ones=[];let k=0;
    const groups=op==="+"?nums.map((n,g)=>[n,G[g]]):[[a,""]];
    groups.forEach(([n,c])=>{for(let i=0;i<Math.floor(n/10);i++)tens.push(item(barHTML(),"ten "+c,(k++)*70))});
    groups.forEach(([n,c])=>{for(let i=0;i<n%10;i++)ones.push(item('<span class="cube"></span>',"one "+c,(k++)*50+200))});
    [...tens,...ones].forEach(it=>cnt.appendChild(it));
    await sleep(1800+k*50);if(!alive())return;
    let keepT=tens,keepO=ones;
    if(op==="-"){
      let ti=tens.length,oi=ones.length;
      for(let g=1;g<nums.length;g++){
        const n=nums[g];
        for(let i=0;i<Math.floor(n/10);i++){tens[--ti].classList.add("gone",G[g]);tone(300-ti*10,.2,"triangle",.18);await sleep(550);if(!alive())return}
        for(let i=0;i<n%10;i++){ones[--oi].classList.add("gone",G[g]);tone(360-oi*10,.2,"triangle",.18);await sleep(450);if(!alive())return}
      }

    }
    let total=0;
    for(const it of keepT){total+=10;await step(it,total,330,950);if(!alive())return}
    for(const it of keepO){total+=1;await step(it,total,523+(total%10)*30,850);if(!alive())return}

    say(lead+(op==="+"?"Let's count together!":"Take some away, then count what is left!"));
    const items=[];
    if(op==="+"){let k=0;nums.forEach((n,g)=>{for(let i=0;i<n;i++)items.push(item(emo,G[g],(k++)*60+g*200))})}
    else for(let i=0;i<a;i++)items.push(item(emo,"",i*60));
    items.forEach(it=>cnt.appendChild(it));
    await sleep(1400+items.length*60);if(!alive())return;
    let left=a;
    if(op==="-"){
      for(let g=1;g<nums.length;g++){
        for(let i=0;i<nums[g];i++){items[--left].classList.add("gone",G[g]);tone(330-(a-left)*12,.2,"triangle",.18);await sleep(450);if(!alive())return}
        await sleep(250);
      }

    }
    const keep=op==="+"?items:items.slice(0,left);
    for(let i=0;i<keep.length;i++){
      await step(keep[i],i+1,392*Math.pow(2,(i%12)/7),keep.length>12?620:780);if(!alive())return;
    }
  }
  $("goodB").hidden=false;
  say(`${nums.join(` ${word(op)} `)} is ${ans}!`);
  await sleep(1200);if(!alive())return;

    fillSlot();cheer();

}

/* a springy "boing" for each letter as it lands */
function boing(f,when){
  if(!soundOn||!actx||actx.state!=="running")return;
  try{
    const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
    o.type="triangle";o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);
    g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.28);
  }catch(e){}
}

  if(!soundOn||!actx||actx.state!=="running")return;
  [[523,0],[659,.12],[784,.24],[1047,.36],[784,.5],[1047,.62]].forEach(([f,d])=>tone(f,d>.55?.4:.14,"square",.07,when+d));

    back=`<path d="M92 120 C112 120 116 100 106 94 C100 90 94 96 100 102" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>
          <path d="M92 120 C112 120 116 100 106 94 C100 90 94 96 100 102" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`;
    ears=`<path d="M26 60 L30 30 L50 48 Z" fill="${c}" ${s}/><path d="M94 60 L90 30 L70 48 Z" fill="${c}" ${s}/>
          <path d="M32 52 L34 38 L44 47 Z" fill="#ffc2e6"/><path d="M88 52 L86 38 L76 47 Z" fill="#ffc2e6"/>`;
    front=`<path d="M60 52 L63 59 L70 59 L64.5 63.5 L66.5 70.5 L60 66.5 L53.5 70.5 L55.5 63.5 L50 59 L57 59 Z" fill="#ffd23f" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }else if(id==="puff"){
    ears=`<ellipse cx="24" cy="78" rx="11" ry="22" fill="#b9d6f2" ${s} transform="rotate(18 24 78)"/><ellipse cx="96" cy="78" rx="11" ry="22" fill="#b9d6f2" ${s} transform="rotate(-18 96 78)"/>`;
    back=`<circle cx="36" cy="52" r="14" fill="${c}" ${s}/><circle cx="60" cy="44" r="17" fill="${c}" ${s}/><circle cx="84" cy="52" r="14" fill="${c}" ${s}/>`;
  }else if(id==="pebble"){
    ears=`<circle cx="30" cy="50" r="14" fill="${c}" ${s}/><circle cx="90" cy="50" r="14" fill="${c}" ${s}/>
          <circle cx="30" cy="50" r="6" fill="#efdfc9"/><circle cx="90" cy="50" r="6" fill="#efdfc9"/>`;
    front=`<ellipse cx="38" cy="68" rx="5" ry="3.5" fill="#8f6c4b"/><ellipse cx="86" cy="112" rx="4" ry="3" fill="#8f6c4b"/><ellipse cx="80" cy="64" rx="3.5" ry="2.5" fill="#8f6c4b"/>`;
  }
  return `<svg viewBox="0 0 120 150" aria-hidden="true"><g class="idle"><g class="whole">
  ${back}${ears}
  <rect class="arm-l" x="12" y="90" width="16" height="26" rx="8" fill="${c}" ${s}/>
  <rect class="arm-r" x="92" y="90" width="16" height="26" rx="8" fill="${c}" ${s}/>
  <ellipse cx="42" cy="138" rx="13" ry="8" fill="${c}" ${s}/><ellipse cx="78" cy="138" rx="13" ry="8" fill="${c}" ${s}/>
  <ellipse cx="60" cy="92" rx="40" ry="45" fill="${c}" ${s}/>
  <ellipse cx="60" cy="110" rx="24" ry="22" fill="${b.belly}"/>
  ${front}
  <ellipse class="eye" cx="46" cy="82" rx="6" ry="8" fill="${INK}"/><ellipse class="eye" cx="74" cy="82" rx="6" ry="8" fill="${INK}"/>
  <circle cx="48" cy="79" r="2.4" fill="#fff"/><circle cx="76" cy="79" r="2.4" fill="#fff"/>
  <ellipse cx="34" cy="94" rx="6" ry="4" fill="#ff8fb6" opacity=".75"/><ellipse cx="86" cy="94" rx="6" ry="4" fill="#ff8fb6" opacity=".75"/>
  <path d="M53 94 Q60 100 67 94" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
  <ellipse class="mouth" cx="60" cy="98" rx="4" ry="1.6" fill="#8a2f3a"/>
</g></g></svg>`;
}
const EGG_SVG=`<svg viewBox="0 0 120 150" aria-hidden="true"><g class="egg">
  <path class="egg-bot" d="M16 86 L24 92 L34 80 L44 92 L54 80 L64 92 L74 80 L84 92 L94 80 L104 86 C104 120 86 140 60 140 C34 140 16 120 16 86 Z" fill="#fff8e6" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
  <g class="egg-top">
    <path d="M16 86 C16 40 38 14 60 14 C82 14 104 40 104 86 L94 80 L84 92 L74 80 L64 92 L54 80 L44 92 L34 80 L24 92 Z" fill="#fff8e6" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="44" cy="46" r="9" fill="#ff8a3d"/><circle cx="76" cy="38" r="7" fill="#29a8ff"/><circle cx="80" cy="66" r="9" fill="#7ed957"/><circle cx="40" cy="72" r="6" fill="#b38cff"/>
  </g>
  <circle cx="34" cy="116" r="7" fill="#ffd23f"/><circle cx="86" cy="112" r="6" fill="#ff8fb6"/><circle cx="60" cy="126" r="5" fill="#29a8ff"/>
</g></svg>`;

let buddy="ember";
function renderBuddies(){document.querySelectorAll("[data-bot]").forEach(el=>el.innerHTML=creatureSVG(buddy))}
/* buddy picker: shown after the egg hatches on every visit, and anytime from the egg button */
let hatchMode="first",hatchReturn=null;
$("hatchGrid").innerHTML=Object.keys(BUDDIES).map((k,i)=>`<button class="cr" data-cr="${k}" style="animation-delay:${i*90}ms" aria-label="${BUDDIES[k].name} the ${BUDDIES[k].kind}"><span class="bot">${creatureSVG(k)}</span><span class="crname">${BUDDIES[k].name}</span></button>`).join("");
async function openHatch(mode){
  hatchMode=mode;hush();
  hatchReturn=mode==="switch"?(!$("start").hidden?"start":"game"):null;
  const egg=$("hatchEgg");egg.innerHTML=EGG_SVG;egg.classList.remove("cracked");
  $("hatchGrid").classList.remove("show");$("hatch").hidden=false;
  say(mode==="first"?"Your egg is hatching!":"A new egg! Let's see who's inside!","hatchBubble");
  crackSound();await sleep(700);egg.classList.add("cracked");sparkle();
  await sleep(500);$("hatchGrid").classList.add("show");
  say("Pick your buddy, Ethan!","hatchBubble");
}
function crackSound(){tone(1200,.05,"square",.06);tone(900,.05,"square",.06,.18);tone(1400,.06,"square",.06,.4);tone(700,.25,"triangle",.14,.62)}
function sparkle(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.12,"sine",.12,i*.07))}
$("hatchGrid").addEventListener("click",e=>{
  const b=e.target.closest(".cr");if(!b)return;
  buddy=b.dataset.cr;renderBuddies();sparkle();confetti();
  $("hatch").hidden=true;
  const n=BUDDIES[buddy].name;
  if(hatchMode==="first"){showIntro();return}
  const where=hatchReturn==="start"?"pickBubble":"gameBubble";
  const bot=hatchReturn==="start"?$("pickBot"):$("gameBot");
  bot.classList.remove("wave");void bot.offsetWidth;bot.classList.add("wave");
  say(`Hi Ethan! I'm ${n}! Let's keep going!`,where);
});
document.querySelectorAll(".eggbtn").forEach(b=>b.addEventListener("click",()=>{primeSpeech();openHatch("switch")}));
renderBuddies();$("tapEgg").innerHTML=EGG_SVG;

loadSettings();setDigits(digits);showCounts();showGames();showLevelTag();renderStars();cur=make();renderProblem();
</script>
</body>
